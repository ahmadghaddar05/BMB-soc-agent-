server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # `/assets` is a React page, while `/assets/` contains Vite's compiled
    # bundles. Handle the exact page route before Nginx resolves the physical
    # asset directory so a hard refresh is returned to React Router.
    location = /assets {
        try_files /index.html =404;
    }

    # If an earlier directory redirect left a trailing slash in a bookmark,
    # normalize it back to the React route. Compiled files below /assets/
    # continue to be served normally by the general location.
    location = /assets/ {
        return 308 /assets;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Grounded analyst progress stream. Keep this unbuffered so cancellation and
    # bounded tool progress reach the browser immediately.
    location = /api/chat/stream {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        gzip               off;
    }

    # Proxy other API calls to the Node backend.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
}
